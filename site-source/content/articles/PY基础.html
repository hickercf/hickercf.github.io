<h2 id="三个重要的库">三个重要的库</h2><h3 id="Numpy">Numpy</h3><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> numpy <span class="keyword">as</span> np</span><br><span class="line"></span><br><span class="line"><span class="comment"># 1. 创建数组</span></span><br><span class="line">a = np.array([<span class="number">1</span>, <span class="number">2</span>, <span class="number">3</span>])              <span class="comment"># 一维</span></span><br><span class="line">b = np.array([[<span class="number">1</span>, <span class="number">2</span>], [<span class="number">3</span>, <span class="number">4</span>]])       <span class="comment"># 二维（矩阵）</span></span><br><span class="line">c = np.zeros((<span class="number">3</span>, <span class="number">4</span>))                 <span class="comment"># 全0矩阵</span></span><br><span class="line">d = np.ones((<span class="number">2</span>, <span class="number">3</span>))                  <span class="comment"># 全1矩阵</span></span><br><span class="line">e = np.random.rand(<span class="number">3</span>, <span class="number">3</span>)            <span class="comment"># 随机矩阵</span></span><br><span class="line">f = np.arange(<span class="number">0</span>, <span class="number">10</span>, <span class="number">2</span>)             <span class="comment"># [0, 2, 4, 6, 8]</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 2. 数组属性（必须会看）</span></span><br><span class="line"><span class="built_in">print</span>(a.shape)     <span class="comment"># 形状，如 (3,) 或 (2, 3)</span></span><br><span class="line"><span class="built_in">print</span>(a.ndim)      <span class="comment"># 维度数，1或2或3</span></span><br><span class="line"><span class="built_in">print</span>(a.dtype)     <span class="comment"># 数据类型，如 int64, float64</span></span><br><span class="line"><span class="built_in">print</span>(a.size)      <span class="comment"># 元素总数</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 3. 切片（和Python列表类似但更强）</span></span><br><span class="line">b = np.array([[<span class="number">1</span>, <span class="number">2</span>, <span class="number">3</span>], [<span class="number">4</span>, <span class="number">5</span>, <span class="number">6</span>]])</span><br><span class="line"><span class="built_in">print</span>(b[<span class="number">0</span>, :])     <span class="comment"># 第一行 [1, 2, 3]</span></span><br><span class="line"><span class="built_in">print</span>(b[:, <span class="number">1</span>])     <span class="comment"># 第二列 [2, 5]</span></span><br><span class="line"><span class="built_in">print</span>(b[<span class="number">0</span>:<span class="number">2</span>, <span class="number">1</span>:<span class="number">3</span>]) <span class="comment"># 行0-1，列1-2</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 4. 广播（Broadcasting）—— 非常重要</span></span><br><span class="line">a = np.array([[<span class="number">1</span>, <span class="number">2</span>, <span class="number">3</span>]])    <span class="comment"># shape (1, 3)</span></span><br><span class="line">b = np.array([[<span class="number">1</span>], [<span class="number">2</span>]])     <span class="comment"># shape (2, 1)</span></span><br><span class="line"><span class="built_in">print</span>(a + b)                  <span class="comment"># shape (2, 3) 自动扩展</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 5. 矩阵运算（AI中最核心）</span></span><br><span class="line">A = np.random.rand(<span class="number">3</span>, <span class="number">4</span>)</span><br><span class="line">B = np.random.rand(<span class="number">4</span>, <span class="number">2</span>)</span><br><span class="line">C = np.dot(A, B)      <span class="comment"># 矩阵乘法 (3,4) @ (4,2) = (3,2)</span></span><br><span class="line">C = A @ B             <span class="comment"># 等价写法</span></span><br><span class="line">A.T                   <span class="comment"># 转置</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 6. 常用操作</span></span><br><span class="line">np.<span class="built_in">sum</span>(a)             <span class="comment"># 所有元素求和</span></span><br><span class="line">np.mean(a)            <span class="comment"># 平均值</span></span><br><span class="line">np.<span class="built_in">max</span>(a, axis=<span class="number">0</span>)     <span class="comment"># 按列最大值</span></span><br><span class="line">np.argmax(a)          <span class="comment"># 最大值的索引（分类任务预测标签常用）</span></span><br><span class="line">np.reshape(a, (<span class="number">2</span>, <span class="number">3</span>)) <span class="comment"># 改变形状</span></span><br><span class="line">np.concatenate([a, b]) <span class="comment"># 拼接</span></span><br></pre></td></tr></table></figure>

<h3 id="Pandas">Pandas</h3><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> pandas <span class="keyword">as</span> pd</span><br><span class="line"></span><br><span class="line"><span class="comment"># 1. 创建和读取</span></span><br><span class="line">df = pd.DataFrame({</span><br><span class="line">    <span class="string">&quot;name&quot;</span>: [<span class="string">&quot;张三&quot;</span>, <span class="string">&quot;李四&quot;</span>, <span class="string">&quot;王五&quot;</span>],</span><br><span class="line">    <span class="string">&quot;age&quot;</span>: [<span class="number">20</span>, <span class="number">21</span>, <span class="number">22</span>],</span><br><span class="line">    <span class="string">&quot;score&quot;</span>: [<span class="number">85</span>, <span class="number">92</span>, <span class="number">78</span>]</span><br><span class="line">})</span><br><span class="line"></span><br><span class="line">df = pd.read_csv(<span class="string">&quot;data.csv&quot;</span>)       <span class="comment"># 读CSV</span></span><br><span class="line">df.to_csv(<span class="string">&quot;output.csv&quot;</span>, index=<span class="literal">False</span>)  <span class="comment"># 写CSV</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 2. 查看数据</span></span><br><span class="line"><span class="built_in">print</span>(df.head())         <span class="comment"># 前5行</span></span><br><span class="line"><span class="built_in">print</span>(df.shape)          <span class="comment"># 行数和列数</span></span><br><span class="line"><span class="built_in">print</span>(df.describe())     <span class="comment"># 统计摘要</span></span><br><span class="line"><span class="built_in">print</span>(df.columns)        <span class="comment"># 列名</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 3. 筛选与过滤</span></span><br><span class="line">df[df[<span class="string">&quot;score&quot;</span>] &gt; <span class="number">80</span>]                              <span class="comment"># 条件筛选</span></span><br><span class="line">df.loc[df[<span class="string">&quot;age&quot;</span>] &gt; <span class="number">20</span>, [<span class="string">&quot;name&quot;</span>, <span class="string">&quot;score&quot;</span>]]         <span class="comment"># 按标签筛选</span></span><br><span class="line">df.sort_values(<span class="string">&quot;score&quot;</span>, ascending=<span class="literal">False</span>)           <span class="comment"># 排序</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 4. 分组聚合</span></span><br><span class="line">df.groupby(<span class="string">&quot;age&quot;</span>)[<span class="string">&quot;score&quot;</span>].mean()   <span class="comment"># 按年龄分组求平均分</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 5. 处理缺失值</span></span><br><span class="line">df.isnull().<span class="built_in">sum</span>()          <span class="comment"># 每列缺失数量</span></span><br><span class="line">df.fillna(<span class="number">0</span>)               <span class="comment"># 填充缺失值</span></span><br><span class="line">df.dropna()                <span class="comment"># 删除缺失行</span></span><br></pre></td></tr></table></figure>

<h3 id="Matplotlib">Matplotlib</h3><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> matplotlib.pyplot <span class="keyword">as</span> plt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 折线图（画loss曲线必备）</span></span><br><span class="line">plt.plot([<span class="number">1</span>, <span class="number">2</span>, <span class="number">3</span>, <span class="number">4</span>], [<span class="number">0.9</span>, <span class="number">0.5</span>, <span class="number">0.3</span>, <span class="number">0.1</span>], label=<span class="string">&quot;loss&quot;</span>)</span><br><span class="line">plt.xlabel(<span class="string">&quot;epoch&quot;</span>)</span><br><span class="line">plt.ylabel(<span class="string">&quot;loss&quot;</span>)</span><br><span class="line">plt.title(<span class="string">&quot;Training Loss&quot;</span>)</span><br><span class="line">plt.legend()</span><br><span class="line">plt.savefig(<span class="string">&quot;loss.png&quot;</span>)</span><br><span class="line">plt.show()</span><br><span class="line"></span><br><span class="line"><span class="comment"># 散点图</span></span><br><span class="line">plt.scatter(x_data, y_data, c=<span class="string">&#x27;red&#x27;</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># 直方图</span></span><br><span class="line">plt.hist(data, bins=<span class="number">50</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># 多子图</span></span><br><span class="line">fig, axes = plt.subplots(<span class="number">1</span>, <span class="number">2</span>)</span><br><span class="line">axes[<span class="number">0</span>].plot(x, y1)</span><br><span class="line">axes[<span class="number">1</span>].plot(x, y2)</span><br></pre></td></tr></table></figure>
